services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentlab}
      POSTGRES_DB: ${POSTGRES_DB:-incidentlab}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - incidentlab-postgres:/var/lib/postgresql/data

volumes:
  incidentlab-postgres:
